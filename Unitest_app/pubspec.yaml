name: unitest_app
description: UniTest mobile client — Flutter app for iOS and Android. Backend on DigitalOcean (Express + MongoDB), shared with web client at unitest.page.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.5.0+1

  # Routing (declarative, deep links)
  go_router: ^14.2.7

  # Real-time
  socket_io_client: ^2.0.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Push (uncomment in Phase 3)
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Rich text (Phase 2/5)
  # flutter_quill: ^10.8.5
  flutter_widget_from_html: ^0.15.2

  # Localization helper
  intl: ^0.19.0

  # Misc
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0     # Used by Phase 6 admin wrapper
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  # When adding custom fonts (e.g. Inter), declare them here:
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800
  #       - asset: assets/fonts/Inter-Black.ttf
  #         weight: 900
